name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Typecheck, lint, tests and the production builds.
      - run: npm run check

      - run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: tasknotes-browser-extension-${{ github.sha }}
          path: dist/*.zip
          retention-days: 30
